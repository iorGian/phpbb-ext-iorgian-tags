name: Update version.json

# When a release is published on GitHub, version.json (read by phpBB's version check through
# raw.githubusercontent.com) is updated with the new version. Pre-releases go to "unstable" only;
# normal releases go to "stable" and "unstable".
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 - <<'PY'
          import json, os, re

          tag = os.environ['TAG']
          url = os.environ['URL']
          prerelease = os.environ['PRERELEASE'] == 'true'

          version = tag[1:] if tag.startswith('v') else tag
          match = re.match(r'^(\d+)\.(\d+)', version)
          if not match:
              raise SystemExit('Tag %r does not look like a version' % tag)
          branch = match.group(1) + '.' + match.group(2)

          data = json.load(open('version.json')) if os.path.exists('version.json') else {}
          data.setdefault('stable', {})
          data.setdefault('unstable', {})

          entry = {
              'current': version,
              'download': url,
              'announcement': url,
              'eol': None,
              'security': False,
          }
          data['unstable'][branch] = entry
          if not prerelease:
              data['stable'][branch] = entry

          with open('version.json', 'w') as handle:
              json.dump(data, handle, indent=4)
              handle.write('\n')
          PY

      - name: Commit version.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json is already up to date"
          else
            git commit -m "Update version.json for ${TAG}"
            git push origin HEAD:main
          fi
